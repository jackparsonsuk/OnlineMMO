<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ostracon</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="title" hidden></div>
    <div id="vignette"></div>
    <div id="nametags"></div>
    <div id="combat-text"></div>

    <div id="compass">
      <div id="compass-strip"></div>
      <div id="compass-target" hidden></div>
      <div id="compass-centre"></div>
    </div>

    <div id="target-frame" hidden>
      <div class="tf-head"><span id="tf-level"></span><span id="tf-name"></span></div>
      <div id="tf-bar"><i></i></div>
      <div id="tf-text"></div>
    </div>

    <div id="minimap">
      <canvas id="minimap-canvas" width="176" height="176"></canvas>
      <div id="minimap-info"></div>
    </div>

    <div id="worldmap" hidden>
      <div id="worldmap-title"></div>
      <canvas id="worldmap-canvas"></canvas>
      <div class="worldmap-hint"><kbd>M</kbd> or <kbd>Esc</kbd> to close</div>
    </div>

    <div id="hud">
      <div id="ostra-name">&nbsp;</div>
      <div id="ostra-subtitle"></div>
      <div id="status">connecting&hellip;</div>
      <div id="stats"></div>
      <div id="roster"></div>
    </div>

    <div id="gate-prompt" hidden></div>

    <div id="speech" hidden>
      <span id="speech-who"></span>
      <span id="speech-line"></span>
    </div>

    <div id="vitals">
      <div id="combat-flag" hidden>In combat</div>
      <div id="health-bar"><i></i></div>
      <div id="health-text"></div>
      <div id="mana-bar"><i></i></div>
      <div id="mana-text"></div>
    </div>

    <div id="abilities"></div>
    <div id="power"></div>
    <div id="notes"></div>

    <div id="toast" hidden></div>
    <button id="sound-toggle" type="button">Sound on</button>

    <div id="character" hidden></div>

    <div id="death" hidden>
      <strong>You have fallen</strong>
      <span id="death-detail"></span>
    </div>

    <div id="hint">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp;&middot;&nbsp;
      <kbd>Shift</kbd> sprint &nbsp;&middot;&nbsp;
      <kbd>Space</kbd>/<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> cast &nbsp;&middot;&nbsp;
      <kbd>Tab</kbd>/click target &nbsp;&middot;&nbsp;
      <kbd>M</kbd> map &nbsp;&middot;&nbsp;
      <kbd>I</kbd> character &amp; pack &nbsp;&middot;&nbsp;
      drag to orbit &nbsp;&middot;&nbsp; scroll to zoom
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
