# fly.toml app configuration file generated for ostracon-spring-thunder-7301 on 2026-09-11T14:54:34+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ostracon-spring-thunder-7301'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_FILE = '/app/data/ostracon.db'
  NODE_ENV = 'production'
  PORT = '2567'
  REALM_ID = 'eu-1'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'ostracon_data'
  destination = '/app/data'

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = 'off'
  # Never stopped on purpose, but if it stops anyway (a crash, a deploy that
  # leaves it down) the next visitor starts it, rather than nobody getting in.
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

# Back up whatever took it down: the world is only there while the process is.
[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
