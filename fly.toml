# fly.toml app configuration file generated for onlinemmo on 2026-09-10T09:48:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'onlinemmo'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_FILE = '/app/data/ostracon.db'
  NODE_ENV = 'production'
  PORT = '2567'
  REALM_ID = 'eu-1'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'ostracon_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
